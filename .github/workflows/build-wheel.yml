name: build-wheel
on:
  push:
    tags: ['wheel-*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install CUDA 12.8 toolkit
        run: bash .github/workflows/cuda/Linux.sh cu128
      - name: Install PyTorch 2.8.0+cu128 and build deps
        run: |
          pip install torch==2.8.0 --extra-index-url https://download.pytorch.org/whl/cu128
          pip install "setuptools<81" wheel ninja numpy
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
      - name: Build wheel
        working-directory: o-voxel
        run: |
          source "$GITHUB_WORKSPACE/.github/workflows/cuda/Linux-env.sh" cu128
          export TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0;10.0;12.0+PTX"
          export FORCE_CUDA=1 MAX_JOBS=2
          python setup.py bdist_wheel --dist-dir="$GITHUB_WORKSPACE/dist"
      - name: Verify native extension present in wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith('.so') for n in names), f'no native .so in {whl}'
          print('OK native ext in', whl)
          PY
      - name: Create release and upload wheel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --title "${GITHUB_REF_NAME}" \
            --notes "o_voxel cp313 / torch 2.8.0+cu128 wheel. TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0;10.0;12.0+PTX"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
